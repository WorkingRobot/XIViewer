[package]
name = "viewer"
description = "Cross-platform FFXIV game data viewer"
authors.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true

[[bin]]
name = "worker"
path = "src/worker/runner.rs"

[dependencies]
half = "2"
crc = "3"
shadow-rs = { version = "2", default-features = false }
egui = "0.35"
eframe = { version = "0.35", default-features = false, features = [
    "accesskit",     # Make egui compatible with screen readers. NOTE: adds a lot of dependencies.
    "default_fonts", # Embed the default egui fonts.
    "glow",          # Use the glow rendering backend. Alternative: "wgpu".
    "persistence",   # Enable restoring app state when restarting the app.
    "wayland",       # To support Linux (and CI)
] }
catppuccin-egui = { version = "5", default-features = false, features = [
    "egui35",
] }
egui_glow = { version = "0.35", default-features = false }
glow = "0.17"
glam = "0.31"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
ironworks = { version = "0.4.1", features = [
    "excel",
    "sqpack",
    "tex",
    "scd",
    "mtrl",
    "uld",
    "fdt",
    "gfd",
    "shpk",
    "shcd",
    "imc",
    "mdl",
    "stm",
    "atch",
    "avfx",
    "dic",
    "eid",
    "est",
    "skp",
    "tera",
    "lgb",
    "sgb",
    "lvb",
    "svb",
    "lcb",
    "uwb",
    "envb",
    "obsb",
    "essb",
    "amb",
    "spm",
    "pbd",
    "pcb",
    "cmp",
    "gzd",
    "ggd",
    "eqdp",
    "eqp",
    "gmp",
    "evp",
    "phyb",
    "sklb",
    "pap",
    "tmb",
    "cutb",
    "hwc",
] }
dxbc = "0.1"
hlsl = "0.1"
shaders = { path = "../shaders" }
shadermerge = { path = "../shadermerge" }
glyphnames = { path = "../glyphnames" }
luadec = { path = "../luadec" }
pathlist = { path = "../pathlist", default-features = false }
symphonia = { version = "0.6.1", default-features = false, features = [
    "adpcm",
    "ogg",
    "vorbis",
    "wav",
] }
cridecoder = "0.3"
hound = "3"
async-channel = "2"
ehttp = { version = "0.7", features = ["streaming", "native-async"] }
lru = "0.18"
url = "2"
nucleo-matcher = "0.3"
anyhow = "1"
intmap = "3"
binrw = "0.15"
num-traits = "0.2"
itertools = "0.15"
rfd = "0.17"
egui_table = "0.9"
egui_extras = { version = "0.35", features = ["http", "image"] }
syntect = { version = "5", default-features = false, features = [
    "default-fancy",
] }
serde_yml = "0.0.13"
serde_json = "1"
jsonschema = { version = "0.49", default-features = false }
async-trait = "0.1"
futures-util = "0.3"
egui_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
image_dds = { version = "0.7", default-features = false, features = ["image", "ddsfile"] }
either = { version = "1", features = ["serde"] }
replace_with = "0.1"
pinned = "0.1"
matchit = "0.9"
zip = { version = "8", default-features = false }
base64 = "0.23"
sha2 = "0.11"
wildmatch = "2"
regex-lite = "0.1"
pest = "2"
pest_derive = "2"
compact_str = { version = "0.10", features = ["smallvec"] }
smallvec = { version = "1", features = ["union"] }
csv = "1"

[build-dependencies]
shadow-rs = { version = "2", default-features = false, features = ["build"] }
winresource = "0.1"

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
blocking = "1"
env_logger = "0.11"
poll-promise = { version = "0.3", features = ["smol"] }
rodio = { version = "0.22", default-features = false, features = ["playback"] }
rustfft = "6"
ureq = "3"

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { version = "0.4", features = [
    "futures-core-03-stream",
] }
poll-promise = { version = "0.3", features = ["web"] }
web-sys = { version = "0.3", features = [
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemHandleKind",
    "FileSystemPermissionMode",
    "FileSystemHandlePermissionDescriptor",
    "PermissionState",
    "FileReaderSync",
    "DirectoryPickerOptions",
    "FileSystemWritableFileStream",
    "History",
    "PopStateEvent",
    "HtmlCollection",
    "Location",
    "Storage",
    "UrlSearchParams",
    "AudioContext",
    "AudioContextState",
    "BaseAudioContext",
    "AnalyserNode",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "GainNode",
    "HtmlMediaElement",
    "HtmlAudioElement",
    "EventTarget",
    "Navigator",
    "Clipboard",
    "MediaSession",
    "MediaMetadata",
    "MediaSessionAction",
    "MediaSessionActionDetails",
    "MediaSessionPlaybackState",
    "MediaPositionState",
    "HtmlElement",
    "Element",
    "Node",
    "Document",
    "Window",
] }
# Fix to allow building for wasm
getrandom = { version = "0.4", features = ["wasm_js"] }
# Fix to allow building for wasm
uuid = { version = "*", features = ["rng-getrandom"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
gloo-worker = "0.6"
serde-wasm-bindgen = "0.6"
indexed-db = "0.4"
web-time = "1"
